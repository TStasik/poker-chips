<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NexGreen Sterling Heights</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  #app { width: 1920px; height: 1080px; display: flex; flex-direction: column; color: #fff; }

  /* TOP BAR */
  .top-bar { background: #008a50; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; height: 100px; flex-shrink: 0; }
  .top-bar-left { display: flex; align-items: center; gap: 20px; }
  .chip-icon { width: 48px; height: 48px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.6); background: #006e40; display: grid; place-items: center; }
  .chip-icon::after { content: ''; width: 20px; height: 20px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.5); }
  .top-titles { display: flex; flex-direction: column; gap: 3px; }
  .top-title { font-size: 38px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; line-height: 1; }
  /* BIGGER, MORE OBVIOUS SUBTITLE */
  .top-subtitle { font-size: 22px; color: #fff; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; }
  .top-week { font-size: 18px; color: rgba(255,255,255,0.65); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 12px; padding-left: 20px; border-left: 2px solid rgba(255,255,255,0.3); align-self: center; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .top-date { font-size: 20px; color: rgba(255,255,255,0.85); font-weight: 500; }
  .top-time { font-size: 32px; color: #fff; font-weight: 800; letter-spacing: 0.05em; }
  .nav-dots { display: flex; gap: 10px; align-items: center; margin-left: 24px; }
  .nav-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background 0.4s, transform 0.4s; }
  .nav-dot.on { background: #fff; transform: scale(1.3); }

  /* BODY */
  .body { flex: 1; min-height: 0; position: relative; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; animation: fadeUp 0.8s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

  /* SECTION HEADER */
  .section-header { background: #005c35; padding: 10px 36px; font-size: 26px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; flex-shrink: 0; border-bottom: 3px solid #00c46a; display: flex; align-items: center; gap: 14px; }

  /* SHARED */
  .two-col { display: grid; grid-template-columns: 460px 1fr; flex: 1; min-height: 0; }
  .left-col { background: #0f0f0f; border-right: 2px solid #1c1c1c; display: flex; flex-direction: column; }
  .right-col { display: flex; flex-direction: column; }
  .col-header { background: #006e40; padding: 10px 24px; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.9); flex-shrink: 0; }

  /* LEADERBOARD — compact so all names fit */
  .leaderboard { flex: 1; overflow: hidden; padding: 4px 0; }
  .lb-row { display: flex; align-items: center; gap: 14px; padding: 7px 22px; border-bottom: 1px solid #181818; }
  .lb-row.podium { background: rgba(0,138,80,0.07); }
  .medal-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .medal-glow-gold   { position:absolute;inset:-5px;border-radius:50%;background:#FAC775;opacity:0.18;animation:pulse-gold 2s ease-in-out infinite; }
  .medal-glow-silver { position:absolute;inset:-5px;border-radius:50%;background:#C8C8C8;opacity:0.15;animation:pulse-silver 2.4s ease-in-out infinite; }
  .medal-glow-bronze { position:absolute;inset:-5px;border-radius:50%;background:#C87941;opacity:0.18;animation:pulse-bronze 2.8s ease-in-out infinite; }
  @keyframes pulse-gold   { 0%,100%{transform:scale(1);opacity:0.18}50%{transform:scale(1.5);opacity:0.32} }
  @keyframes pulse-silver { 0%,100%{transform:scale(1);opacity:0.15}50%{transform:scale(1.5);opacity:0.26} }
  @keyframes pulse-bronze { 0%,100%{transform:scale(1);opacity:0.18}50%{transform:scale(1.5);opacity:0.28} }
  .medal-rays-gold   { position:absolute;inset:-8px;border-radius:50%;box-shadow:0 0 12px 3px #FAC775;opacity:0.4;animation:ray-gold 2s ease-in-out infinite; }
  .medal-rays-silver { position:absolute;inset:-8px;border-radius:50%;box-shadow:0 0 12px 3px #C8C8C8;opacity:0.3;animation:ray-silver 2.4s ease-in-out infinite; }
  .medal-rays-bronze { position:absolute;inset:-8px;border-radius:50%;box-shadow:0 0 12px 3px #C87941;opacity:0.35;animation:ray-bronze 2.8s ease-in-out infinite; }
  @keyframes ray-gold   { 0%,100%{opacity:0.4}50%{opacity:0.75} }
  @keyframes ray-silver { 0%,100%{opacity:0.3}50%{opacity:0.6} }
  @keyframes ray-bronze { 0%,100%{opacity:0.35}50%{opacity:0.65} }
  .medal { position:relative;z-index:2;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900; }
  .m1 { background:#FAC775;color:#412402;border:3px solid #e8a830; }
  .m2 { background:#C8C8C8;color:#1a1a1a;border:3px solid #a0a0a0; }
  .m3 { background:#C87941;color:#1a1a1a;border:3px solid #a05a28; }
  .mx { background:#1e1e1e;color:#666;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900; }
  .lb-name { flex:1;font-size:19px;font-weight:600;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .lb-right { display:flex;flex-direction:column;align-items:flex-end;gap:4px; }
  .lb-chips { font-size:26px;font-weight:900;color:#00c46a;line-height:1; }
  .lb-bar-wrap { width:80px;height:4px;background:#222;border-radius:2px; }
  .lb-bar { height:100%;background:#008a50;border-radius:2px; }

  /* POKER INNER VIEWS */
  .inner-view { flex:1;display:none;flex-direction:column;min-height:0; }
  .inner-view.active { display:flex;animation:fadeUp 0.7s ease; }
  .winners-grid { flex:1;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;overflow:hidden;align-content:start; }
  .wcard { background:#141414;border:1px solid #202020;border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;gap:4px; }
  .wcard.hot { border-color:#008a50;background:#0d1a14; }
  .wcard-top { display:flex;align-items:flex-start;justify-content:space-between;gap:8px; }
  .wcard-names { font-size:18px;font-weight:700;color:#fff;line-height:1.3; }
  .wcard-chips { font-size:26px;font-weight:900;color:#00c46a;flex-shrink:0;line-height:1; }
  .wcard-cat { font-size:12px;color:#008a50;font-weight:800;text-transform:uppercase;letter-spacing:0.06em; }
  .wcard-note { font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .alltime-list { flex:1;padding:10px 20px;display:flex;flex-direction:column;gap:7px;overflow:hidden; }
  .at-row { display:flex;align-items:center;gap:16px;background:#141414;border:1px solid #1e1e1e;border-radius:8px;padding:10px 18px; }
  .at-rank { width:30px;font-size:16px;color:#555;font-weight:900;text-align:center;flex-shrink:0; }
  .at-rank.top3 { color:#00c46a; }
  .at-name { flex:1;font-size:20px;font-weight:600;color:#ddd; }
  .at-bar-wrap { width:240px;height:5px;background:#222;border-radius:3px;flex-shrink:0; }
  .at-bar { height:100%;background:#008a50;border-radius:3px; }
  .at-chips { font-size:24px;font-weight:900;color:#00c46a;min-width:50px;text-align:right;flex-shrink:0; }

  /* NPS — 2 cols, compact cards so all fit */
  .nps-grid { flex:1;padding:10px 24px;display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:hidden;align-content:start; }
  .nps-card { background:#141414;border:1px solid #202020;border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;gap:6px; }
  .nps-name { font-size:20px;font-weight:700;color:#fff; }
  .nps-score-row { display:flex;align-items:center;justify-content:space-between;gap:10px; }
  .nps-score { font-size:44px;font-weight:900;line-height:1; }
  .nps-score.green  { color:#00c46a; }
  .nps-score.yellow { color:#f0c040; }
  .nps-score.red    { color:#e05555; }
  .nps-score.none   { color:#555;font-size:26px; }
  .nps-meta { display:flex;gap:10px;flex-wrap:wrap;align-items:center; }
  /* slightly larger font for pills as requested */
  .nps-pill { font-size:16px;font-weight:800;padding:4px 12px;border-radius:20px; }
  .nps-pill.pro  { background:rgba(0,196,106,0.15);color:#00c46a; }
  .nps-pill.det  { background:rgba(224,85,85,0.15);color:#e05555; }
  .nps-pill.resp { background:rgba(255,255,255,0.07);color:#888; }
  .nps-bar-wrap { height:5px;background:#222;border-radius:3px; }
  .nps-bar { height:100%;border-radius:3px;background:#008a50; }

  /* DRIVER SCORES — compact rows so full team fits */
  .ds-full { flex:1;padding:8px 24px;display:flex;flex-direction:column;gap:6px;overflow:hidden; }
  .ds-row { display:flex;align-items:center;gap:12px;background:#141414;border:1px solid #1e1e1e;border-radius:8px;padding:8px 16px; }
  .ds-name { width:190px;font-size:18px;font-weight:600;color:#eee;flex-shrink:0; }
  .ds-months { display:flex;gap:4px;flex:1;align-items:center; }
  .ds-month { display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px; }
  .ds-month-label { font-size:9px;color:#444;font-weight:700;text-transform:uppercase;letter-spacing:0.05em; }
  .ds-month-val { font-size:15px;font-weight:800; }
  .ds-month-val.green  { color:#00c46a; }
  .ds-month-val.yellow { color:#f0c040; }
  .ds-month-val.red    { color:#e05555; }
  .ds-month-val.empty  { color:#2a2a2a; }
  .ds-yearend-wrap { display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;min-width:72px; }
  .ds-yearend-label { font-size:9px;color:#444;font-weight:700;text-transform:uppercase;letter-spacing:0.06em; }
  .ds-yearend { font-size:22px;font-weight:900; }
  .ds-yearend.green  { color:#00c46a; }
  .ds-yearend.yellow { color:#f0c040; }
  .ds-yearend.red    { color:#e05555; }
  .ds-yearend.empty  { color:#333; }

  /* BOTTOM BAR */
  .bottom-bar { background:#0d1a14;border-top:2px solid #008a50;height:44px;display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0; }
  .ticker-label { font-size:13px;font-weight:800;color:#008a50;letter-spacing:0.12em;text-transform:uppercase;flex-shrink:0; }
  .ticker-divider { width:2px;height:22px;background:#008a50;opacity:0.4;flex-shrink:0; }
  .ticker-wrap { flex:1;overflow:hidden; }
  .ticker { font-size:20px;font-weight:700;color:#00c46a;white-space:nowrap;display:inline-block;animation:scroll 55s linear infinite; }
  @keyframes scroll { 0%{transform:translateX(1920px)}100%{transform:translateX(-100%)} }
  .loading { display:flex;align-items:center;justify-content:center;height:100%;font-size:24px;color:#444; }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="chip-icon"></div>
      <div class="top-titles">
        <div class="top-title">Poker Chips 2026</div>
        <div class="top-subtitle">NexGreen Sterling Heights</div>
      </div>
      <div class="top-week" id="top-week"></div>
      <div class="nav-dots">
        <div class="nav-dot on" id="nd0"></div>
        <div class="nav-dot" id="nd1"></div>
        <div class="nav-dot" id="nd2"></div>
      </div>
    </div>
    <div class="top-right">
      <div class="top-date" id="top-date">—</div>
      <div class="top-time" id="top-time">—</div>
    </div>
  </div>

  <div class="body">

    <!-- SCREEN 1: POKER CHIPS -->
    <div class="screen active" id="screen-chips">
      <div class="section-header">🏆 Poker Chips — Employee Recognition</div>
      <div class="two-col">
        <div class="left-col">
          <div class="col-header">All-Time Leaderboard</div>
          <div class="leaderboard" id="lb-list"><div class="loading">Loading...</div></div>
        </div>
        <div class="right-col">
          <div class="inner-view active" id="view-week">
            <div class="col-header">This Week's Winners</div>
            <div class="winners-grid" id="winners-grid"><div class="loading">Loading...</div></div>
          </div>
          <div class="inner-view" id="view-alltime">
            <div class="col-header">All-Time Chip Totals</div>
            <div class="alltime-list" id="alltime-list"><div class="loading">Loading...</div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: NPS -->
    <div class="screen" id="screen-nps">
      <div class="section-header">⭐ Net Promoter Scores — Year to Date</div>
      <div class="nps-grid" id="nps-grid"><div class="loading">Loading...</div></div>
    </div>

    <!-- SCREEN 3: DRIVER SCORES -->
    <div class="screen" id="screen-drivers">
      <div class="section-header">🚗 Driver Safety Scores — 2026</div>
      <div class="ds-full" id="ds-list"><div class="loading">Loading...</div></div>
    </div>

  </div>

  <div class="bottom-bar">
    <div class="ticker-label" id="ticker-label">Poker Chips</div>
    <div class="ticker-divider"></div>
    <div class="ticker-wrap"><div class="ticker" id="ticker">Loading...</div></div>
  </div>
</div>

<script>
const POKER_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTx8ZFK52wFkCtOiefM3r2qK_58KpY2XRWdrHK2Zh9B_3FM5zAWCyKYZ4RN_WFbS4FcLQBjoggl6IxK/pub?output=csv';
const NPS_URL    = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTXb6OEUdrzzmd-9E1jp_FDu7OrD8Af1tDTDOVwqkZkJOcG_-lpOO2VKlJ6OMmGVqMeMU_OcHEbCGf5/pub?gid=552293431&single=true&output=csv';
const DRIVER_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRhhNairFH07Go7kt7bO1A6PyJ_MgUOBetN6RiQGoiBQFernx3fdTlKq9RT4eQhYmp3scrkR1s-slFF/pub?gid=0&single=true&output=csv';

const SCREEN_MS  = 30000;
const REFRESH_MS = 5 * 60 * 1000;
const MONTHS = ['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
const TICKER_LABELS = ['Poker Chips','NPS','Driver Scores'];

function parseCSVRaw(text) {
  return text.trim().split('\n').map(line => {
    const cols=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){cols.push(cur.trim().replace(/^"|"$/g,''));cur='';}
      else{cur+=c;}
    }
    cols.push(cur.trim().replace(/^"|"$/g,''));
    return cols;
  });
}
function parseCSV(text) {
  const raw=parseCSVRaw(text);
  if(!raw.length)return[];
  const headers=raw[0];
  return raw.slice(1).map(cols=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(cols[i]||'').trim());
    return obj;
  }).filter(r=>Object.values(r).some(v=>v));
}
function npsColor(val){
  if(val===null||isNaN(val))return'none';
  if(val>=9)return'green'; if(val>=7)return'yellow'; return'red';
}
function dsColor(val){
  const n=parseFloat(val);
  if(isNaN(n)||val===''||val==null)return'empty';
  if(n>=90)return'green'; if(n>=75)return'yellow'; return'red';
}
function medalHTML(i){
  if(i===0)return`<div class="medal-wrap"><div class="medal-glow-gold"></div><div class="medal-rays-gold"></div><div class="medal m1">1</div></div>`;
  if(i===1)return`<div class="medal-wrap"><div class="medal-glow-silver"></div><div class="medal-rays-silver"></div><div class="medal m2">2</div></div>`;
  if(i===2)return`<div class="medal-wrap"><div class="medal-glow-bronze"></div><div class="medal-rays-bronze"></div><div class="medal m3">3</div></div>`;
  return`<div class="medal-wrap"><div class="mx">${i+1}</div></div>`;
}

// POKER
function buildAllTime(rows){
  const totals={};
  rows.forEach(r=>{
    const chips=parseInt(r['Manager Over-ride']||r.Chips)||0;
    if(!chips)return;
    (r.Technician||'').split(',').map(n=>n.trim()).filter(Boolean).forEach(name=>{totals[name]=(totals[name]||0)+chips;});
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}
function getCurrentWeekRows(rows){
  let maxWeek=0;
  rows.forEach(r=>{const w=parseInt(r.Week);if(w>maxWeek)maxWeek=w;});
  return{weekRows:rows.filter(r=>parseInt(r.Week)===maxWeek),maxWeek};
}
function renderPoker(rows){
  const allTime=buildAllTime(rows);
  const{weekRows,maxWeek}=getCurrentWeekRows(rows);
  const weekDate=weekRows.find(r=>r.Date)?.Date||'';
  document.getElementById('top-week').textContent=`Week ${maxWeek}${weekDate?' · '+weekDate:''}`;
  const top10=allTime.slice(0,10),maxC=top10[0]?.[1]||1;
  document.getElementById('lb-list').innerHTML=top10.map(([name,chips],i)=>`
    <div class="lb-row${i<3?' podium':''}">${medalHTML(i)}
      <div class="lb-name">${name}</div>
      <div class="lb-right"><div class="lb-chips">${chips}</div>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.round(chips/maxC*100)}%"></div></div>
      </div></div>`).join('');
  const hotCats=['Intangible Impact','New Sale/ Gross Add','Accident-Free Month','Perfect Attendance'];
  document.getElementById('winners-grid').innerHTML=weekRows.map(r=>{
    const chips=parseInt(r['Manager Over-ride']||r.Chips)||0;
    return`<div class="wcard${(hotCats.includes(r.Category)||chips>=3)?' hot':''}">
      <div class="wcard-top"><div class="wcard-names">${r.Technician||'—'}</div><div class="wcard-chips">+${chips}</div></div>
      <div class="wcard-cat">${r.Category}</div>
      ${r.Notes?`<div class="wcard-note">${r.Notes}</div>`:''}</div>`;
  }).join('');
  const maxAt=allTime[0]?.[1]||1;
  document.getElementById('alltime-list').innerHTML=allTime.slice(0,12).map(([name,chips],i)=>`
    <div class="at-row"><div class="at-rank${i<3?' top3':''}">${i+1}</div>
      <div class="at-name">${name}</div>
      <div class="at-bar-wrap"><div class="at-bar" style="width:${Math.round(chips/maxAt*100)}%"></div></div>
      <div class="at-chips">${chips}</div></div>`).join('');
  const notable=weekRows.filter(r=>r.Notes||parseInt(r['Manager Over-ride']||r.Chips)>=2);
  window._tickerPoker=notable.length?notable.map(r=>`${r.Technician||'Team'}  —  ${r.Category}${r.Notes?':  '+r.Notes:''}`).join('     •     '):'Great work team!';
}

// NPS
function renderNPS(rows){
  const keys=Object.keys(rows[0]||{});
  const techKey=keys[0],proKey=keys[1],detKey=keys[2],respKey=keys[3],scoreKey=keys[4];
  const valid=rows.filter(r=>r[techKey]&&r[techKey]!=='Tech'&&r[techKey]!=='');
  const maxResp=Math.max(...valid.map(r=>parseInt(r[respKey])||0),1);
  document.getElementById('nps-grid').innerHTML=valid.map(r=>{
    const name=(!r[techKey]||r[techKey]==='0')?'Unassigned':r[techKey];
    const raw=r[scoreKey],isNone=!raw||raw==='None'||raw===''||raw==='#DIV/0!';
    const score=isNone?null:parseFloat(raw),cls=npsColor(score);
    const pro=parseInt(r[proKey])||0,det=parseInt(r[detKey])||0,resp=parseInt(r[respKey])||0;
    return`<div class="nps-card">
      <div class="nps-name">${name}</div>
      <div class="nps-score-row">
        <div class="nps-score ${cls}">${isNone?'—':score.toFixed(1)}</div>
        <div class="nps-meta">
          <div class="nps-pill pro">👍 ${pro} Promoters</div>
          <div class="nps-pill det">👎 ${det} Detractors</div>
          <div class="nps-pill resp">${resp} Reviews</div>
        </div>
      </div>
      <div class="nps-bar-wrap"><div class="nps-bar" style="width:${Math.round(resp/maxResp*100)}%"></div></div>
    </div>`;
  }).join('');
  const top=valid.filter(r=>{const raw=r[scoreKey];return raw&&raw!=='None'&&raw!==''&&parseFloat(raw)>=9;});
  window._tickerNPS=top.length?'Top NPS: '+top.map(r=>`${r[techKey]==='0'?'Unassigned':r[techKey]} (${parseFloat(r[scoreKey]).toFixed(1)})`).join('  •  '):'NPS scores updated — keep earning great reviews!';
}

// DRIVER SCORES
function renderDrivers(text){
  const raw=parseCSVRaw(text);
  let headerRowIdx=-1;
  for(let i=0;i<raw.length;i++){if(raw[i].some(c=>c.trim().toLowerCase().includes('specialist'))){headerRowIdx=i;break;}}
  if(headerRowIdx===-1){document.getElementById('ds-list').innerHTML='<div class="loading">Could not find headers</div>';return;}
  const headers=raw[headerRowIdx].map(h=>h.trim());
  const nameIdx=headers.findIndex(h=>h.toLowerCase().includes('specialist'));
  const dataRows=[];
  for(let i=headerRowIdx+1;i<raw.length;i++){
    const row=raw[i],name=(row[nameIdx]||'').trim();
    if(!name)continue;
    if(name.toLowerCase().includes('branch')||name.toLowerCase().includes('average')||name.toLowerCase().includes('avg'))break;
    dataRows.push(row);
  }
  const yearIdx=headers.findIndex(h=>h.toLowerCase().includes('year'));
  document.getElementById('ds-list').innerHTML=dataRows.map(row=>{
    const name=(row[nameIdx]||'Unassigned').trim();
    const monthCells=MONTHS.map(m=>{
      const idx=headers.findIndex(h=>h.trim()===m);
      const val=idx>=0?(row[idx]||'').trim():'';
      const n=parseFloat(val),cls=dsColor(val);
      return`<div class="ds-month"><div class="ds-month-label">${m}</div><div class="ds-month-val ${cls}">${isNaN(n)||val===''?'—':n}</div></div>`;
    }).join('');
    const yeVal=yearIdx>=0?(row[yearIdx]||'').trim():'',yeN=parseFloat(yeVal),yeCls=dsColor(yeVal);
    return`<div class="ds-row">
      <div class="ds-name">${name}</div>
      <div class="ds-months">${monthCells}</div>
      <div class="ds-yearend-wrap"><div class="ds-yearend-label">Year End</div><div class="ds-yearend ${yeCls}">${isNaN(yeN)||yeVal===''?'—':yeN}</div></div>
    </div>`;
  }).join('');
  const top=dataRows.filter(row=>{const v=yearIdx>=0?(row[yearIdx]||'').trim():'';return parseFloat(v)>=90;});
  window._tickerDrivers=top.length?'Top driver scores: '+top.map(row=>`${(row[nameIdx]||'').trim()} (${parseFloat(row[yearIdx]||0)})`).join('  •  '):'Driver scores updated — stay safe out there!';
}

async function fetchText(url){const res=await fetch(url+'&t='+Date.now());return res.text();}
async function loadAll(){
  try{renderPoker(parseCSV(await fetchText(POKER_URL)));}catch(e){console.error('Poker',e);}
  try{renderNPS(parseCSV(await fetchText(NPS_URL)));}catch(e){console.error('NPS',e);}
  try{renderDrivers(await fetchText(DRIVER_URL));}catch(e){console.error('Drivers',e);}
}

function updateClock(){
  const now=new Date();
  document.getElementById('top-date').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('top-time').textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
updateClock();setInterval(updateClock,10000);

const screens=['screen-chips','screen-nps','screen-drivers'];
let screenIdx=0;
function setTicker(idx){
  document.getElementById('ticker-label').textContent=TICKER_LABELS[idx];
  const texts=[window._tickerPoker||'Loading...',window._tickerNPS||'Loading...',window._tickerDrivers||'Loading...'];
  const t=document.getElementById('ticker');
  t.textContent=texts[idx];t.style.animation='none';t.offsetHeight;t.style.animation='';
}
function nextScreen(){
  document.getElementById(screens[screenIdx]).classList.remove('active');
  document.getElementById('nd'+screenIdx).classList.remove('on');
  screenIdx=(screenIdx+1)%screens.length;
  document.getElementById(screens[screenIdx]).classList.add('active');
  document.getElementById('nd'+screenIdx).classList.add('on');
  if(screenIdx!==0)document.getElementById('top-week').textContent='';
  setTicker(screenIdx);
}
setInterval(nextScreen,SCREEN_MS);

let innerIdx=0;
setInterval(()=>{
  if(screenIdx!==0)return;
  const views=['view-week','view-alltime'];
  document.getElementById(views[innerIdx]).classList.remove('active');
  innerIdx=(innerIdx+1)%2;
  document.getElementById(views[innerIdx]).classList.add('active');
},12000);

loadAll();
setInterval(loadAll,REFRESH_MS);
setTicker(0);
</script>
