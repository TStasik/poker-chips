<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NexGreen Sterling Heights</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  #app { width: 1920px; height: 1080px; display: flex; flex-direction: column; color: #fff; }

  /* TOP BAR */
  .top-bar {
    background: #008a50; display: flex; align-items: center; justify-content: space-between;
    padding: 0 48px; height: 95px; flex-shrink: 0;
  }
  .top-bar-left { display: flex; align-items: center; gap: 20px; }
  .chip-icon { width: 45px; height: 45px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.6); background: #006e40; display: grid; place-items: center; }
  .chip-icon::after { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); }
  .top-titles { display: flex; flex-direction: column; gap: 2px; }
  .top-title { font-size: 34px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; line-height: 1; }
  .top-subtitle { font-size: 15px; color: rgba(255,255,255,0.75); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .top-section { font-size: 18px; color: rgba(255,255,255,0.7); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 12px; padding-left: 20px; border-left: 2px solid rgba(255,255,255,0.3); align-self: center; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .top-date { font-size: 18px; color: rgba(255,255,255,0.85); font-weight: 500; }
  .top-time { font-size: 28px; color: #fff; font-weight: 800; letter-spacing: 0.05em; }

  /* NAV DOTS */
  .nav-dots { display: flex; gap: 10px; align-items: center; margin-left: 24px; }
  .nav-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background 0.4s, transform 0.4s; }
  .nav-dot.on { background: #fff; transform: scale(1.3); }

  /* BODY */
  .body { flex: 1; min-height: 0; position: relative; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; animation: fadeUp 0.8s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

  /* POKER CHIPS LAYOUT */
  .two-col { display: grid; grid-template-columns: 440px 1fr; height: 100%; }
  .left-col { background: #0f0f0f; border-right: 2px solid #1c1c1c; display: flex; flex-direction: column; }
  .right-col { display: flex; flex-direction: column; background: #0a0a0a; }
  .col-header { background: #006e40; padding: 10px 22px; font-size: 14px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.9); flex-shrink: 0; }

  /* LEADERBOARD - CONDENSED LIKE DRIVER SCORES */
  .leaderboard { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 0; }
  .lb-row { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #191919; }
  .lb-row.top3 { padding: 6px 20px; background: rgba(0,138,80,0.07); }
  .lb-row.other { padding: 3px 20px; }
  .medal-wrap { position: relative; width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .medal-glow-gold   { position:absolute;inset:-4px;border-radius:50%;background:#FAC775;opacity:0.18;animation:pulse-gold 2s ease-in-out infinite; }
  .medal-glow-silver { position:absolute;inset:-4px;border-radius:50%;background:#C8C8C8;opacity:0.15;animation:pulse-silver 2.4s ease-in-out infinite; }
  .medal-glow-bronze { position:absolute;inset:-4px;border-radius:50%;background:#C87941;opacity:0.18;animation:pulse-bronze 2.8s ease-in-out infinite; }
  @keyframes pulse-gold   { 0%,100%{transform:scale(1);opacity:0.18}50%{transform:scale(1.5);opacity:0.32} }
  @keyframes pulse-silver { 0%,100%{transform:scale(1);opacity:0.15}50%{transform:scale(1.5);opacity:0.26} }
  @keyframes pulse-bronze { 0%,100%{transform:scale(1);opacity:0.18}50%{transform:scale(1.5);opacity:0.28} }
  .medal-rays-gold   { position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 10px 3px #FAC775;opacity:0.4;animation:ray-gold 2s ease-in-out infinite; }
  .medal-rays-silver { position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 10px 3px #C8C8C8;opacity:0.3;animation:ray-silver 2.4s ease-in-out infinite; }
  .medal-rays-bronze { position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 10px 3px #C87941;opacity:0.35;animation:ray-bronze 2.8s ease-in-out infinite; }
  @keyframes ray-gold   { 0%,100%{opacity:0.4}50%{opacity:0.75} }
  @keyframes ray-silver { 0%,100%{opacity:0.3}50%{opacity:0.6} }
  @keyframes ray-bronze { 0%,100%{opacity:0.35}50%{opacity:0.65} }
  .medal { position:relative;z-index:2;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900; }
  .m1 { background:#FAC775;color:#412402;border:2px solid #e8a830; }
  .m2 { background:#C8C8C8;color:#1a1a1a;border:2px solid #a0a0a0; }
  .m3 { background:#C87941;color:#1a1a1a;border:2px solid #a05a28; }
  .mx { background:#1e1e1e;color:#666;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900; }
  .lb-name { flex:1;font-size:16px;font-weight:600;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .lb-right { display:flex;flex-direction:column;align-items:flex-end;gap:2px; }
  .lb-chips { font-size:20px;font-weight:900;color:#00c46a;line-height:1; }
  .lb-bar-wrap { width:60px;height:3px;background:#222;border-radius:2px; }
  .lb-bar { height:100%;background:#008a50;border-radius:2px; }

  /* RIGHT PANEL - ALTERNATING VIEWS */
  .right-panel-view { flex: 1; overflow-y: auto; min-height: 0; padding: 12px; }
  .view { display: none; height: 100%; }
  .view.active { display: block; animation: fadeUp 0.5s ease; }
  
  /* WINNERS GRID */
  .winners-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wcard { background:#141414; border:1px solid #202020; border-radius:8px; padding: 8px 12px; }
  .wcard.hot { border-color:#008a50; background:#0d1a14; }
  .wcard-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .wcard-names { font-size:15px; font-weight:700; color:#fff; }
  .wcard-chips { font-size:20px; font-weight:900; color:#00c46a; }
  .wcard-cat { font-size:10px; color:#008a50; font-weight:800; text-transform:uppercase; margin-bottom:3px; }
  .wcard-note { font-size:10px; color:#f0a040; font-style:italic; }

  /* REDEMPTION BOARD */
  .redemption-board svg { width: 100%; height: auto; display: block; }

  /* NPS LAYOUT */
  .nps-layout { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  .nps-left-panel { background: #0f0f0f; border-right: 2px solid #1c1c1c; display: flex; flex-direction: column; padding: 20px; }
  .nps-stats { margin-bottom: 25px; }
  .nps-stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #6a9278; margin-bottom: 4px; }
  .nps-stat-value { font-size: 48px; font-weight: 900; color: #00c46a; font-family: 'Bebas Neue', cursive; }
  .nps-stat-value.gold { color: #FFD166; }
  .nps-stat-value.red { color: #e05555; }
  .nps-right { overflow-y: auto; padding: 12px 18px; }
  .nps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .nps-card { background:#141414; border:1px solid #202020; border-radius:6px; padding: 6px 10px; }
  .nps-card.nps-subcard { background:rgba(0,138,80,0.05); border:1px dashed rgba(0,138,80,0.3); }
  .nps-name { font-size:14px; font-weight:700; color:#fff; margin-bottom:3px; }
  .nps-score-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:3px; }
  .nps-score { font-size:26px; font-weight:900; line-height:1; }
  .nps-score.green { color:#00c46a; }
  .nps-score.yellow { color:#f0c040; }
  .nps-score.red { color:#e05555; }
  .nps-score.none { color:#555; font-size:16px; }
  .nps-meta { display:flex; gap:5px; }
  .nps-pill { font-size:9px; font-weight:700; padding:2px 5px; border-radius:20px; }
  .nps-pill.pro { background:rgba(0,196,106,0.15); color:#00c46a; }
  .nps-pill.det { background:rgba(224,85,85,0.15); color:#e05555; }
  .nps-pill.resp { background:rgba(255,255,255,0.07); color:#888; }
  .nps-bar-wrap { height:2px; background:#222; border-radius:2px; margin-top:5px; }
  .nps-bar { height:100%; border-radius:2px; background:#008a50; }
  
  /* FULL WIDTH DIVIDER */
  .nps-divider { margin: 10px 0 6px 0; padding: 3px 0; background: rgba(0,138,80,0.15); border-radius: 3px; font-size: 11px; font-weight: 700; color: #008a50; text-align: center; letter-spacing: 1px; grid-column: 1 / -1; }

  /* DRIVER SCORES - WITH MEDALS */
  .driver-layout { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
  .driver-left-panel { background: #0f0f0f; border-right: 2px solid #1c1c1c; display: flex; flex-direction: column; padding: 20px; }
  .driver-stats { margin-bottom: 25px; }
  .driver-stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #6a9278; margin-bottom: 4px; }
  .driver-stat-value { font-size: 48px; font-weight: 900; color: #00c46a; font-family: 'Bebas Neue', cursive; }
  .driver-podium { margin-top: 20px; }
  .podium-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1c1c1c; }
  .podium-medal { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
  .podium-medal .medal { width: 34px; height: 34px; font-size: 14px; }
  .podium-name { flex: 1; font-size: 14px; font-weight: 600; color: #fff; }
  .podium-score { font-size: 18px; font-weight: 900; color: #00c46a; }
  .driver-right { overflow-y: auto; padding: 10px 15px; }
  .ds-list { display: flex; flex-direction: column; gap: 3px; }
  .ds-row { display: flex; align-items: center; gap: 8px; background: #141414; border: 1px solid #1e1e1e; border-radius: 5px; padding: 3px 8px; }
  .ds-name { width: 150px; font-size: 12px; font-weight: 600; color: #eee; flex-shrink: 0; }
  .ds-months { display: flex; gap: 3px; flex: 1; align-items: center; }
  .ds-month { display: flex; flex-direction: column; align-items: center; gap: 0px; min-width: 28px; }
  .ds-month-label { font-size: 5px; color: #444; font-weight: 700; text-transform: uppercase; }
  .ds-month-val { font-size: 10px; font-weight: 800; }
  .ds-month-val.green  { color: #00c46a; }
  .ds-month-val.yellow { color: #f0c040; }
  .ds-month-val.red    { color: #e05555; }
  .ds-month-val.empty  { color: #333; }
  .ds-yearend { font-size: 14px; font-weight: 900; min-width: 42px; text-align: right; flex-shrink: 0; }
  .ds-yearend.green  { color: #00c46a; }
  .ds-yearend.yellow { color: #f0c040; }
  .ds-yearend.red    { color: #e05555; }
  .ds-yearend-label { font-size: 5px; color: #444; font-weight: 700; text-transform: uppercase; text-align: center; }
  .ds-yearend-wrap { display: flex; flex-direction: column; align-items: center; gap: 0px; flex-shrink: 0; min-width: 45px; }

  /* BOTTOM BAR */
  .bottom-bar { background:#0d1a14;border-top:2px solid #008a50;height:40px;display:flex;align-items:center;padding:0 25px;gap:16px;flex-shrink:0; }
  .ticker-label { font-size:11px;font-weight:800;color:#008a50;letter-spacing:0.12em;text-transform:uppercase;flex-shrink:0; }
  .ticker-divider { width:2px;height:18px;background:#008a50;opacity:0.4;flex-shrink:0; }
  .ticker-wrap { flex:1;overflow:hidden; }
  .ticker { font-size:16px;font-weight:700;color:#00c46a;white-space:nowrap;display:inline-block;animation:scroll 45s linear infinite; }
  @keyframes scroll { 0%{transform:translateX(1920px)}100%{transform:translateX(-100%)} }

  .loading { display:flex; align-items:center; justify-content:center; height:100%; font-size:18px; color:#444; }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="chip-icon"></div>
      <div class="top-titles">
        <div class="top-title">NexGreen Sterling Heights</div>
        <div class="top-subtitle" id="top-section-label">Team Dashboard 2026</div>
      </div>
      <div class="top-section" id="top-week"></div>
      <div class="nav-dots">
        <div class="nav-dot on" id="nd0" title="Poker Chips"></div>
        <div class="nav-dot" id="nd1" title="NPS"></div>
        <div class="nav-dot" id="nd2" title="Driver Scores"></div>
      </div>
    </div>
    <div class="top-right">
      <div class="top-date" id="top-date">—</div>
      <div class="top-time" id="top-time">—</div>
    </div>
  </div>

  <div class="body">
    <!-- SCREEN 1: POKER CHIPS -->
    <div class="screen active" id="screen-chips">
      <div class="two-col">
        <div class="left-col">
          <div class="col-header">🏆 All-Time Leaderboard</div>
          <div class="leaderboard" id="lb-list"><div class="loading">Loading...</div></div>
        </div>
        <div class="right-col">
          <div class="col-header">🎁 Prize & Recognition</div>
          <div class="right-panel-view">
            <div class="view" id="view-redemption">
              <div class="redemption-board" id="redemption-board"></div>
            </div>
            <div class="view" id="view-winners">
              <div class="winners-grid" id="winners-grid"><div class="loading">Loading...</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCREEN 2: NPS -->
    <div class="screen" id="screen-nps">
      <div class="nps-layout">
        <div class="nps-left-panel">
          <div class="nps-stats">
            <div class="nps-stat-label">Year End Total</div>
            <div class="nps-stat-value gold" id="branch-nps">—</div>
          </div>
          <div class="nps-stats">
            <div class="nps-stat-label">Total Responses</div>
            <div class="nps-stat-value" id="total-responses">—</div>
          </div>
          <div class="nps-stats">
            <div class="nps-stat-label">Below 70 — Attention</div>
            <div class="nps-stat-value red" id="attention-count">—</div>
          </div>
        </div>
        <div class="nps-right">
          <div class="nps-grid" id="nps-grid"><div class="loading">Loading...</div></div>
        </div>
      </div>
    </div>

    <!-- SCREEN 3: DRIVER SCORES -->
    <div class="screen" id="screen-drivers">
      <div class="driver-layout">
        <div class="driver-left-panel">
          <div class="driver-stats">
            <div class="driver-stat-label">Branch Average YTD</div>
            <div class="driver-stat-value" id="branch-avg">—</div>
          </div>
          <div class="driver-stats">
            <div class="driver-stat-label">Total Drivers Tracked</div>
            <div class="driver-stat-value" id="total-drivers">—</div>
          </div>
          <div class="driver-podium">
            <div class="driver-stat-label" style="margin-bottom: 10px;">🏆 Top 3 Performers</div>
            <div id="driver-podium-list"><div class="loading">Loading...</div></div>
          </div>
        </div>
        <div class="driver-right">
          <div class="ds-list" id="ds-list"><div class="loading">Loading...</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="ticker-label" id="ticker-label">Poker Chips</div>
    <div class="ticker-divider"></div>
    <div class="ticker-wrap"><div class="ticker" id="ticker">Loading...</div></div>
  </div>
</div>

<script>
const POKER_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTx8ZFK52wFkCtOiefM3r2qK_58KpY2XRWdrHK2Zh9B_3FM5zAWCyKYZ4RN_WFbS4FcLQBjoggl6IxK/pub?output=csv';

const SCREEN_MS = 30000;
const REFRESH_MS = 5 * 60 * 1000;
const MONTHS = ['Jan','Feb','Mar','Apr','May','June','July','Aug','Sept','Oct','Nov','Dec'];
const SECTION_LABELS = ['Poker Chips 2026', 'Net Promoter Score', 'Driver Safety Scores'];
const TICKER_LABELS  = ['Poker Chips', 'NPS', 'Driver Scores'];

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
      else{cur+=c;}
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h,i) => obj[h]=(cols[i]||'').replace(/^"|"$/g,'').trim());
    return obj;
  }).filter(r => Object.values(r).some(v=>v));
}

function npsColor(val) {
  if (val === null || val === undefined || isNaN(val)) return 'none';
  if (val >= 9)  return 'green';
  if (val >= 7)  return 'yellow';
  return 'red';
}

function medalHTML(i) {
  if (i===0) return `<div class="medal-wrap"><div class="medal-glow-gold"></div><div class="medal-rays-gold"></div><div class="medal m1">1</div></div>`;
  if (i===1) return `<div class="medal-wrap"><div class="medal-glow-silver"></div><div class="medal-rays-silver"></div><div class="medal m2">2</div></div>`;
  if (i===2) return `<div class="medal-wrap"><div class="medal-glow-bronze"></div><div class="medal-rays-bronze"></div><div class="medal m3">3</div></div>`;
  return `<div class="medal-wrap"><div class="mx">${i+1}</div></div>`;
}

function buildAllTime(rows) {
  const totals = {};
  rows.forEach(r => {
    const chips = parseInt(r['Manager Over-ride']||r.Chips)||0;
    if (!chips) return;
    r.Technician.split(',').map(n=>n.trim()).filter(Boolean).forEach(name=>{
      totals[name]=(totals[name]||0)+chips;
    });
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}

function getCurrentWeekRows(rows) {
  let maxWeek=0;
  rows.forEach(r=>{const w=parseInt(r.Week);if(w>maxWeek)maxWeek=w;});
  return {weekRows:rows.filter(r=>parseInt(r.Week)===maxWeek),maxWeek};
}

function renderNPS(rows) {
  const techKey  = Object.keys(rows[0]||{})[0];
  const proKey   = Object.keys(rows[0]||{})[1];
  const detKey   = Object.keys(rows[0]||{})[2];
  const respKey  = Object.keys(rows[0]||{})[3];
  const scoreKey = Object.keys(rows[0]||{})[4];

  const regularTechs = [];
  const unassignedList = [];
  const managers = [];
  
  rows.forEach(r => {
    const name = r[techKey];
    if (!name || name === 'Tech') return;
    
    if (name === '0' || name === ')' || name === 'Unassigned') {
      unassignedList.push(r);
    } else if (name.toLowerCase().includes('joe') || name.toLowerCase().includes('troy') || 
               name.toLowerCase().includes('eddie') || name.toLowerCase().includes('manager')) {
      managers.push(r);
    } else {
      regularTechs.push(r);
    }
  });
  
  // Year End Total from cell C29:E29 = 52.78
  document.getElementById('branch-nps').textContent = '52.78';
  
  let totalResp = 0;
  [...regularTechs, ...managers, ...unassignedList].forEach(r => {
    totalResp += parseInt(r[respKey]) || 0;
  });
  document.getElementById('total-responses').textContent = totalResp;
  
  const lowCount = [...regularTechs, ...managers].filter(r => {
    const s = parseFloat(r[scoreKey]); return !isNaN(s) && s < 70;
  }).length;
  document.getElementById('attention-count').textContent = lowCount;
  
  const maxResp = Math.max(...[...regularTechs, ...unassignedList, ...managers].map(r=>parseInt(r[respKey])||0), 1);
  
  let html = '';
  
  html += regularTechs.map(r => {

  if (managers.length || unassignedList.length) {

    html += managers.map(r => {

      const cls = npsColor(score);
      const pro = parseInt(r[proKey])||0;
      const det = parseInt(r[detKey])||0;

          </div>
        </div>
        <div class="nps-bar-wrap"><div class="nps-bar" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    
    html += unassignedList.map(r => {
      const raw = r[scoreKey];
      const isNone = !raw || raw==='None' || raw==='' || raw==='#DIV/0!';
      const score = isNone ? null : parseFloat(raw);
      const cls = npsColor(score);
      const pro = parseInt(r[proKey])||0;
      const det = parseInt(r[detKey])||0;
      const resp = parseInt(r[respKey])||0;
      const pct = Math.round(resp/maxResp*100);
      return `<div class="nps-card nps-subcard">
        <div class="nps-name">Unassigned</div>

async function renderDrivers() {
  const res = await fetch(DRIVER_URL+'&t='+Date.now());
  const text = await res.text();
  const lines = text.trim().split('\n').map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
  
  let headerIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].some(cell => cell.toLowerCase().includes('specialist'))) {
      headerIdx = i;
      break;
    }
  }
  
  if (headerIdx === -1) {
    document.getElementById('ds-list').innerHTML = '<div class="loading">Could not find driver data</div>';
    return;
  }
  
  const headers = lines[headerIdx];
  const nameIdx = headers.findIndex(h => h.toLowerCase().includes('specialist'));
  const yearIdx = headers.findIndex(h => h.toLowerCase().includes('year'));
  
  const monthIndices = [];
  MONTHS.forEach(m => {
    const idx = headers.findIndex(h => h === m);
    if (idx !== -1) monthIndices.push(idx);
  });
  
  const dataRows = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const name = lines[i][nameIdx] || '';
    if (!name) continue;
    if (name.toLowerCase().includes('branch') || name.toLowerCase().includes('average')) break;
    dataRows.push(lines[i]);
  }
  
  const validScores = [];
  dataRows.forEach(row => {
    const ye = row[yearIdx];
    if (ye && !isNaN(parseFloat(ye))) {
      validScores.push({ name: row[nameIdx], score: parseFloat(ye), row: row });
    }
  });
  
  const avgScore = validScores.length > 0 ? validScores.reduce((s, v) => s + v.score, 0) / validScores.length : 0;
  const topDrivers = [...validScores].sort((a,b) => b.score - a.score).slice(0, 3);
  
  document.getElementById('branch-avg').textContent = avgScore.toFixed(1);
  document.getElementById('total-drivers').textContent = dataRows.length;
  
  // Driver podium with same medal style as poker chips
  document.getElementById('driver-podium-list').innerHTML = topDrivers.map((d, i) => {
    let medalHtml = '';
    if (i === 0) medalHtml = `<div class="podium-medal"><div class="medal-wrap"><div class="medal-glow-gold"></div><div class="medal-rays-gold"></div><div class="medal m1" style="width:34px;height:34px;font-size:14px;">1</div></div></div>`;
    else if (i === 1) medalHtml = `<div class="podium-medal"><div class="medal-wrap"><div class="medal-glow-silver"></div><div class="medal-rays-silver"></div><div class="medal m2" style="width:34px;height:34px;font-size:14px;">2</div></div></div>`;
    else medalHtml = `<div class="podium-medal"><div class="medal-wrap"><div class="medal-glow-bronze"></div><div class="medal-rays-bronze"></div><div class="medal m3" style="width:34px;height:34px;font-size:14px;">3</div></div></div>`;
    return `
      <div class="podium-item">
        ${medalHtml}
        <div class="podium-name">${d.name}</div>
        <div class="podium-score">${d.score.toFixed(1)}</div>
      </div>
    `;
  }).join('');
  
  document.getElementById('ds-list').innerHTML = dataRows.map(row => {
    const name = row[nameIdx] || '—';
    const monthCells = monthIndices.map(idx => {
      const val = row[idx];
      if (!val || val === '') return `<div class="ds-month"><div class="ds-month-label">${MONTHS[monthIndices.indexOf(idx)]}</div><div class="ds-month-val empty">—</div></div>`;
      const num = parseFloat(val);
      if (isNaN(num)) return `<div class="ds-month"><div class="ds-month-label">${MONTHS[monthIndices.indexOf(idx)]}</div><div class="ds-month-val empty">—</div></div>`;
      let cls = 'green';
      if (num < 75) cls = 'red';
      else if (num < 90) cls = 'yellow';
      return `<div class="ds-month"><div class="ds-month-label">${MONTHS[monthIndices.indexOf(idx)]}</div><div class="ds-month-val ${cls}">${num}</div></div>`;
    }).join('');
    
    const yeVal = yearIdx !== -1 ? row[yearIdx] : '';
    const yeNum = parseFloat(yeVal);
    let yeCls = 'empty';
    let yeDisplay = '—';
    if (!isNaN(yeNum) && yeVal !== '') {
      yeDisplay = yeNum.toFixed(1);
      if (yeNum >= 90) yeCls = 'green';
      else if (yeNum >= 75) yeCls = 'yellow';
      else yeCls = 'red';
    }
    
    return `<div class="ds-row">
      <div class="ds-name">${name}</div>
      <div class="ds-months">${monthCells}</div>
      <div class="ds-yearend-wrap">
        <div class="ds-yearend-label">Year End</div>
        <div class="ds-yearend ${yeCls}">${yeDisplay}</div>
      </div>
    </div>`;
  }).join('');

  window._tickerDrivers = validScores.length
    ? 'Top drivers: ' + topDrivers.map(d => `${d.name} (${d.score.toFixed(1)})`).join('  •  ')
    : 'Driver scores updated — stay safe out there!';
}

async function fetchCSV(url) {
  const res = await fetch(url+'&t='+Date.now());
  return parseCSV(await res.text());
}

async function loadAll() {
  try { const pokerRows = await fetchCSV(POKER_URL); renderPoker(pokerRows); } catch(e){ console.error('Poker failed',e);}
  try { const npsRows = await fetchCSV(NPS_URL); renderNPS(npsRows); } catch(e){ console.error('NPS failed',e);}
  try { await renderDrivers(); } catch(e){ console.error('Driver failed',e);}
}

function updateClock() {
  const now = new Date();
  document.getElementById('top-date').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('top-time').textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,10000);

const screens = ['screen-chips','screen-nps','screen-drivers'];
let screenIdx = 0;
let rightPanelIdx = 0;

function setTicker(idx) {
  document.getElementById('ticker-label').textContent = TICKER_LABELS[idx];
  const texts = [window._tickerPoker||'Loading...', window._tickerNPS||'Loading...', window._tickerDrivers||'Loading...'];
  const t = document.getElementById('ticker');
  t.textContent = texts[idx];
  t.style.animation='none'; t.offsetHeight; t.style.animation='';
}

function nextScreen() {
  document.getElementById(screens[screenIdx]).classList.remove('active');
  document.getElementById('nd'+screenIdx).classList.remove('on');
  screenIdx = (screenIdx+1)%screens.length;
  document.getElementById(screens[screenIdx]).classList.add('active');
  document.getElementById('nd'+screenIdx).classList.add('on');
  document.getElementById('top-section-label').textContent = SECTION_LABELS[screenIdx];
  if(screenIdx!==0) document.getElementById('top-week').textContent='';
  setTicker(screenIdx);
}

function flipRightPanel() {
  if (screenIdx !== 0) return;
  const views = ['view-redemption', 'view-winners'];
  document.getElementById(views[rightPanelIdx]).classList.remove('active');
  rightPanelIdx = (rightPanelIdx + 1) % 2;
  document.getElementById(views[rightPanelIdx]).classList.add('active');
}

loadAll();
setInterval(loadAll, REFRESH_MS);
setInterval(nextScreen, SCREEN_MS);
setInterval(flipRightPanel, 12000);
setTicker(0);
document.getElementById('view-redemption').classList.add('active');
</script>
